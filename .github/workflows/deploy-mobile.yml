# モバイルアプリのデプロイ（EAS Build / 029-mobile-offline-logs）
# 手動実行で Expo の EAS Build にネイティブビルドを投入する。
# ビルド自体は EAS のクラウドで実行されるため、このワークフローは投入（キック）のみ行い
# 完了を待たない（--no-wait）。進捗・成果物は expo.dev のプロジェクト Builds ページで確認する。
# 事前準備: mobile/ で `eas init` 済みであること + リポジトリ Secrets に EXPO_TOKEN が登録されていること。
name: Deploy (mobile)

on:
    workflow_dispatch:
        inputs:
            platform:
                description: 'ビルド対象のプラットフォーム'
                required: true
                default: 'android'
                type: choice
                options:
                    - android
                    - ios
                    - all
            profile:
                description: 'ビルドプロファイル（mobile/eas.json）。preview は内部配布用・production はストア提出用'
                required: true
                default: 'preview'
                type: choice
                options:
                    - preview
                    - production

# 同時投入による混乱を防ぐため直列化し、実行中の投入は完走させる（deploy-stg / deploy-prod と同方針）
concurrency:
    group: deploy-mobile
    cancel-in-progress: false

# GITHUB_TOKEN は最小権限に固定（ci.yml と同方針）
permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            # production ビルドは main からのみ（フィーチャーブランチからの誤ビルド防止 / deploy-prod と同方針）
            - name: Guard production branch
              if: ${{ inputs.profile == 'production' && github.ref != 'refs/heads/main' }}
              # コンテキスト式を run に直接展開するとブランチ名経由のシェル注入になるため env 経由で参照する
              env:
                  CURRENT_REF: ${{ github.ref }}
              run: |
                  echo "::error::production プロファイルは main ブランチからのみ実行できます（現在: ${CURRENT_REF}）"
                  exit 1
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            # EAS CLI のセットアップ + EXPO_TOKEN での認証
            - uses: expo/expo-github-action@v8
              with:
                  eas-version: latest
                  token: ${{ secrets.EXPO_TOKEN }}
            # モノレポのため root で npm ci（mobile は workspaces で解決される）
            - run: npm ci
            - name: Kick EAS Build
              working-directory: mobile
              # 入力値は run に直接展開せず env 経由で参照する（式展開によるシェル注入防止）
              env:
                  EAS_PLATFORM: ${{ inputs.platform }}
                  EAS_PROFILE: ${{ inputs.profile }}
              run: |
                  eas build --platform "$EAS_PLATFORM" --profile "$EAS_PROFILE" --non-interactive --no-wait
                  {
                      echo "### EAS Build を投入しました"
                      echo "- platform: ${EAS_PLATFORM}"
                      echo "- profile: ${EAS_PROFILE}"
                      echo "- 進捗・成果物: expo.dev のプロジェクト → Builds ページで確認"
                  } >> "$GITHUB_STEP_SUMMARY"
