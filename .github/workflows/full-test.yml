# 重いテスト（E2E / a11y / Storybook テスト）— 手動実行
# 自動トリガー（main push / FR-011）は手動運用への移行で廃止（2026-07-17）。
# Actions タブの「Run workflow」から対象ブランチを選んで実行する。
# シークレット不使用: Supabase ローカルスタックの公開デフォルトキーをジョブ内で生成する（FR-008）
name: Full Test

on:
    workflow_dispatch:

concurrency:
    group: full-test-${{ github.ref }}
    cancel-in-progress: false

# GITHUB_TOKEN は最小権限に固定（依存 install スクリプト経由のトークン窃取対策）
permissions:
    contents: read

jobs:
    e2e:
        runs-on: ubuntu-latest
        # 2 コアランナー・workers=1 で 99 件（両アプリの dev サーバー起動 + オンデマンドコンパイル込み）を回すため余裕を持たせる
        timeout-minutes: 45
        env:
            # config.toml の auth.email.smtp.enabled が env(SMTP_ENABLED) を参照するため、
            # 未定義だと supabase CLI が config パースで失敗する。CI はメール実送信しないので false 固定
            SMTP_ENABLED: false
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - uses: supabase/setup-cli@v1
              with:
                  # version: latest は実行のたびに GitHub API で最新リリースを解決するため、
                  # 未認証のレート制限に達して失敗する。バージョンを固定して API 解決を回避する。
                  version: 2.107.0
            - name: Supabase ローカルスタックを起動
              run: supabase start
            - name: seed.sql を生成（テストユーザー）
              # seed.sql は gitignore 対象の生成物（make supabase-seed が .env.local から envsubst で作る）。
              # CI には無いため、ここで同じ手順で生成する。値は E2E（e2e/shared/users.ts）が使う公開のダミーで、シークレットではない。
              # これが無いと supabase db reset は seed を黙ってスキップし、E2E のログインがすべて失敗する
              env:
                  TEST_USER_ID: 11111111-1111-1111-1111-111111111111
                  TEST_USER_EMAIL: test@example.com
                  TEST_USER_PASSWORD: password123
              run: envsubst '$TEST_USER_ID $TEST_USER_EMAIL $TEST_USER_PASSWORD' < supabase/seed.sql.template > supabase/seed.sql
            - name: マイグレーション + シード投入（テストユーザー作成）
              run: supabase db reset
            - name: ローカルスタックの接続情報から各アプリの .env を生成（シークレット不要）
              # E2E は e2e/ ワークスペースが service-front / admin-front の dev サーバーを起動するため、両アプリ分を用意する
              run: |
                  eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
                  for app in service-front admin-front; do
                      {
                          echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
                          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
                      } > "${app}/.env"
                  done
                  # admin-front は Admin API（MFA 状態参照）で service_role を使う。ローカルスタックの公開デフォルト値
                  echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}" >> admin-front/.env
            - name: Playwright ブラウザをインストール
              run: npx playwright install chromium --with-deps
              working-directory: e2e
            - name: E2E / a11y テスト（service-front + admin-front）
              run: npm run test --workspace e2e
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: e2e/playwright-report
                  retention-days: 7

    storybook-test:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            # Supabase クライアントの生成に必要（story は実通信しないためダミーで良い。シークレットではない）
            NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
            NEXT_PUBLIC_SUPABASE_ANON_KEY: storybook-dummy-anon-key
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Playwright ブラウザをインストール
              run: npx playwright install chromium --with-deps
              working-directory: service-front
            - name: Storybook テスト（Vitest browser mode）
              run: npm run test:storybook --workspace service-front
