# 重いテスト（E2E / a11y / Storybook テスト）— 手動実行
# 自動トリガー（main push / FR-011）は手動運用への移行で廃止（2026-07-17）。
# Actions タブの「Run workflow」から対象ブランチを選んで実行する。
# シークレット不使用: Supabase ローカルスタックの公開デフォルトキーをジョブ内で生成する（FR-008）
name: Full Test

on:
    workflow_dispatch:

concurrency:
    group: full-test-${{ github.ref }}
    cancel-in-progress: false

# GITHUB_TOKEN は最小権限に固定（依存 install スクリプト経由のトークン窃取対策）
permissions:
    contents: read

jobs:
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            # config.toml の auth.email.smtp.enabled が env(SMTP_ENABLED) を参照するため、
            # 未定義だと supabase CLI が config パースで失敗する。CI はメール実送信しないので false 固定
            SMTP_ENABLED: false
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - uses: supabase/setup-cli@v1
              with:
                  # version: latest は実行のたびに GitHub API で最新リリースを解決するため、
                  # 未認証のレート制限に達して失敗する。バージョンを固定して API 解決を回避する。
                  version: 2.107.0
            - name: Supabase ローカルスタックを起動
              run: supabase start
            - name: マイグレーション + シード投入（テストユーザー作成）
              run: supabase db reset
            - name: ローカルスタックの接続情報から .env を生成（シークレット不要）
              run: |
                  eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY)=')"
                  {
                      echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
                      echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
                  } > service-front/.env
            - name: Playwright ブラウザをインストール
              run: npx playwright install chromium --with-deps
              working-directory: service-front
            - name: E2E / a11y テスト
              run: npm run test:e2e --workspace service-front
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: service-front/playwright-report
                  retention-days: 7

    storybook-test:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            # Supabase クライアントの生成に必要（story は実通信しないためダミーで良い。シークレットではない）
            NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
            NEXT_PUBLIC_SUPABASE_ANON_KEY: storybook-dummy-anon-key
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Playwright ブラウザをインストール
              run: npx playwright install chromium --with-deps
              working-directory: service-front
            - name: Storybook テスト（Vitest browser mode）
              run: npm run test:storybook --workspace service-front
