# stg 環境（Supabase stg プロジェクト）向けの設定差分
#
# なぜこのファイルがあるか:
#   `config.toml` はローカルスタック用の値（localhost の URL・nonce チェック省略など）を含むため、
#   そのまま `supabase config push` するとリモートを壊す。環境ごとの差分をこのファイルに分離し、
#   ベース（config.toml）の共通設定（パスワード要件・メール確認・日本語テンプレート等）は継承する。
#
# 使い方:
#   Supabase CLI は `supabase/config.toml` という固定名しか読まず、`config push` は `[remotes.*]` ブロックを
#   含む config を拒否する。そこで `supabase/scripts/build-remote-config.sh staging <project_ref>` が
#   このファイルの `[remotes.staging.<section>]` を `[<section>]` と読み替え、config.toml の該当キーを
#   置き換えたフラットな config.toml を生成してから push する（追記ではなくマージ）。
#   `project_id` は link 先の Reference ID と一致するかの検証にだけ使い、出力には含めない。
#   デプロイワークフロー（.github/workflows/_deploy.yml）が自動で実行する。
#
# ここに書くもの / 書かないもの:
#   - 書く: ベースと値が異なる項目だけ（URL・レート制限・ローカル用回避策の無効化）
#   - 書かない: シークレット（env() で注入する）、ローカルと同じ値（ベースから継承される）
#   - 新しい TOML テーブルは必ず `[remotes.staging.` で始める（マージ対象の識別に使う）
#   - `enabled = true` だけの部分上書きは書かない（CLI のスキーマ検証がそのブロック単体に必須項目を要求する）

[remotes.staging]
# stg プロジェクトの Reference ID（Dashboard → Project Settings → General → Project ID）。
# Secret ではないのでコミットしてよい。GitHub Secret SUPABASE_PROJECT_REF と同じ値にする。
project_id = "ymbhvtebuglkheehjtci"

[remotes.staging.auth]
# service-front の stg 固定 URL（Vercel の NEXT_PUBLIC_SITE_URL と揃える）
site_url = "https://diving-log-stg.sekinedaichi.com"
# ログイン後の戻り先として許可する URL。`/**` でパス全体を包含する
# （メールリンク・Google OAuth の戻り先 /api/auth/callback もここに含まれる）。
# Vercel の Preview 一時 URL からもログインしたい場合は "https://*-<team-slug>.vercel.app/**" を追加する。
additional_redirect_urls = [
    "https://diving-log-stg.sekinedaichi.com/**",
    "https://diving-log-admin-stg.sekinedaichi.com/**",
]

[remotes.staging.auth.rate_limit]
# ベースの 2 通/時はローカル（Mailpit）前提の値。stg は Resend 経由で動作確認するため引き上げる
email_sent = 30

# SMTP（Resend）の実送信はベースの enabled = "env(SMTP_ENABLED)" を CI が SMTP_ENABLED='true' で解決して有効化する。
# ここで [remotes.staging.auth.email.smtp] enabled = true と部分上書きすると、CLI のスキーマ検証が
# 上書きブロック単体に「enabled なら host 等が必須」を適用してデプロイが止まるため、このファイルには書かない。

[remotes.staging.auth.external.google]
# ベースの skip_nonce_check = true はローカルで Google ログインするための回避策。
# リモートはブラウザ経由で nonce が通るため不要で、外すと OIDC のリプレイ攻撃耐性が落ちる（specs/016-google-login）。
skip_nonce_check = false
