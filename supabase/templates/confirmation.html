<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>メールアドレスの確認</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', Meiryo, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f4f4f5; padding: 24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 480px; background-color: #ffffff; border-radius: 8px; padding: 32px;">
            <tr>
              <td>
                <h1 style="margin: 0 0 16px; font-size: 20px; color: #111827;">ダイビングログ</h1>
                <p style="margin: 0 0 16px; font-size: 14px; line-height: 1.7; color: #374151;">
                  ご登録ありがとうございます。<br />
                  下のボタンからメールアドレスの確認を完了して、ダイビングログのご利用を開始してください。
                </p>
                <p style="margin: 0 0 24px;">
                  <a
                    href="{{ .ConfirmationURL }}"
                    style="display: inline-block; padding: 12px 24px; background-color: #2563eb; color: #ffffff; font-size: 14px; font-weight: 600; text-decoration: none; border-radius: 6px;"
                  >
                    メールアドレスを確認する
                  </a>
                </p>
                <p style="margin: 0 0 8px; font-size: 12px; line-height: 1.7; color: #6b7280;">
                  ボタンが動作しない場合は、次の URL をブラウザに貼り付けてアクセスしてください。
                </p>
                <p style="margin: 0 0 24px; font-size: 12px; line-height: 1.7; color: #2563eb; word-break: break-all;">
                  {{ .ConfirmationURL }}
                </p>
                <p style="margin: 0; font-size: 12px; line-height: 1.7; color: #9ca3af;">
                  このメールに心当たりがない場合は、破棄してください。<br />
                  確認リンクの有効期限は発行から 1 時間です。
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
